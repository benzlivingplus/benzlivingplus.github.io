<!DOCTYPE html>
  <html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Living Plus - Coming Soon</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
            min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      color: #fff;
            font-family: 'Segoe UI', sans-serif;
      text-align: center;
}
    h1 { font-size: 3rem; letter-spacing: 0.1em; margin-bottom: 1rem; }
    p { font-size: 1.2rem; color: #aaa; margin-bottom: 2rem; }
        .dot { display: inline-block; width: 10px; height: 10px; background: #fff; border-radius: 50%; margin: 0 5px; animation: bounce 1.2s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-12px)} }
  </style>
    </head>
    <body>
      <h1>The Living Plus</h1>
  <p>Coming Soon</p>
  <div>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </body>
    </html>
