<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE LIVING PLUS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* THE LIVING PLUS */
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.8rem, 5vw, 3rem);
      letter-spacing: 0.35em;
      color: #111;
      text-transform: uppercase;
      opacity: 0;
      animation: slideDown 1s ease forwards 0.3s;
      transform: translateY(-14px);
      white-space: nowrap;
    }

    @keyframes slideDown {
      to { opacity: 1; transform: translateY(0); }
    }

    /* เส้น — ยาวเท่าข้อความ brand-name */
    .divider-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1s ease forwards 0.9s;
    }

    .divider {
      height: 1.5px;
      width: 100%;        /* ยืดตาม .text-block */
      background: linear-gradient(to right, transparent 0%, #8B0000 8%, #8B0000 92%, transparent 100%);
    }

    /* กล่องจัดกลุ่ม brand + divider ให้ divider กว้างตาม brand */
    .text-block {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }

    /* COMING SOON */
    .coming-soon {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: clamp(0.65rem, 1.8vw, 0.9rem);
      letter-spacing: 0.5em;
      color: #8B0000;
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 1.3s, shimmer 2.8s ease-in-out infinite 2s;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }



    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8B0000;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.22s; }
    .dot:nth-child(3) { animation-delay: 0.44s; }

    @keyframes pulse {
      0%, 100% { transform: scale(0.5); opacity: 0.25; }
      50%       { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="text-block">
      <div class="brand-name">The Living Plus</div>
      <div class="divider-wrap"><div class="divider"></div></div>
    </div>
    <div class="coming-soon">Coming Soon</div>
  
  </div>
</body>
</html>
